[project]
name = "fiap-ml-stock-price-prediction"
version = "1.0.0"
description = "ML pipeline for stock price prediction using LSTM. Covers data ingestion (yfinance), preprocessing, model training and evaluation, plus deployment as a REST API (Flask/FastAPI) with monitoring and scalable serving for real-time financial forecasting."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "boto3>=1.43.24",
    "dagshub>=0.7.0",
    "fastapi>=0.136.3",
    "matplotlib>=3.10.9",
    "mlflow>=1.27.0",
    "networkx>=3.6.1",
    "numpy<2.0.0",
    "pandas>=3.0.3",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "setuptools<70.0.0",
    "starlette-context>=0.5.1",
    "tensorflow<2.16",
    "tensorflow-intel>=2.14.0",
    "tensorflow-io-gcs-filesystem==0.31.0",
    "uvicorn>=0.49.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "optuna>=4.9.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tensorflow-io-gcs-filesystem==0.31.0",
]
