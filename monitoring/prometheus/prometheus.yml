global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fiap-ml-stock-price-prediction"
    static_configs:
      - targets: ["model:8001"]
        labels:
          environment: "local"
          application: "ml-inference-api"

  # Job do Airflow via StatsD Exporter
  - job_name: "airflow"
    scheme: http
    metrics_path: metrics
    static_configs:
      - targets: ["airflow-statsd:9102"]
        labels:
          environment: "local"
          application: "airflow"
          airflow_id: "airflow"
