apiVersion: 1

datasources:
  - name: MinIO-S3-Parquet
    type: tobiasworkstech-parquets3-datasource
    access: proxy
    jsonData:
      authType: keys
      endpoint: http://minio:9000
      defaultRegion: us-east-1
      bucket: bronze
      forcePathStyle: true
    secureJsonData:
      accessKey: ${MINIO_ROOT_USER}
      secretKey: ${MINIO_ROOT_PASSWORD}
