  #  ports:
  #    - "127.0.0.1:4566:4566"            # Porta principal da API AWS
  #    - "127.0.0.1:4510-4559:4510-4559"
  #  environment:
  #    - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
  #    - SERVICES=s3,ecr,ecs,iam,ec2,elb
  #    - DOCKER_HOST=unix:///var/run/docker.sock
  #  #network_mode: bridge
  #  volumes:
  #    - "/var/run/docker.sock:/var/run/docker.sock"
  #    - localstack_data:/var/lib/localstack

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  #localstack_data:
