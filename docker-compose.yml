name: mlops

services:
  # ---------------------------------------------------------
  # MinIO: O nosso Data Lake local (Substitui o AWS S3)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:latest
    #container_name: minio
    ports:
      - "9000:9000" # Porta da API (usada pelo boto3/Python)
      - "9001:9001" # Porta da Interface Gráfica (Web UI)
    env_file: ".env"
    command: server /data --console-address ":9001"
    #network_mode: bridge
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------
  # MinIO Init: Container efêmero para criar os buckets
  # ---------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    #container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy # Só roda quando o MinIO estiver 100% pronto
    env_file: ".env"
    #network_mode: bridge
    entrypoint: >
      /bin/sh -c "
      echo 'Configurando o alias do MinIO...';
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};

      echo 'Criando os buckets do Data Lake...';
      mc mb myminio/bronze --ignore-existing;
      mc mb myminio/silver --ignore-existing;
      mc mb myminio/gold --ignore-existing;
      mc mb myminio/models --ignore-existing;

      echo 'Configuração do MinIO concluída!';
      "

  # ---------------------------------------------------------
  # PostgreSQL: Base de metadados
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    #container_name: postgres
    ports:
      - "5432:5432"
    env_file: ".env"
    #network_mode: bridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 3. Observability Layer (Prometheus + Grafana + Optuna)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    #container_name: mlops_prometheus
    ports:
      - "9090:9090"
    #network_mode: bridge
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.1.0
    #container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
    #network_mode: bridge
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisionamento automático de Dashboards e Data Sources
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    #container_name: optuna-dashboard
    ports:
      - "8888:8080"
    env_file: ".env"
    depends_on:
      - postgres
    command:
      - "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

  # ---------------------------------------------------------
  # FastAPI: Aplicação de Inferência e API
  # ---------------------------------------------------------
  model:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: ptsantos/private:fiap-ml-stock-price-prediction
    ports:
      - "8001:8001"
    env_file: ".env"
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - OPTUNA_STORAGE_URI=postgresql+psycopg2://admin:admin@postgres:5432/stock-price-lstm
    volumes:
      # Mapeia o código fonte para hot-reload no ambiente local
      - ./src:/app/src:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    command: ["uvicorn", "src.api.main:app", "--host", "${API_HOST:-[IP_ADDRESS]}", "--port", "${API_PORT:-8001}", "--workers", "${WEB_CONCURRENCY:-1}"]
    develop:
      watch:
        # Sincroniza o diretório de trabalho com o diretório `/src` no container
        - action: sync
          path: ./src
          target: /app/src
          # Exclui o ambiente virtual do projeto
          ignore:
            - .venv/
        # Rebuild the image on changes to the `pyproject.toml`
        - action: rebuild
          path: ./pyproject.toml

  # ---------------------------------------------------------
  # Model Init: Container para sincronização inicial
  # ---------------------------------------------------------
  model-init:
    image: ptsantos/private:fiap-ml-stock-price-prediction
    env_file: ".env"
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - OPTUNA_STORAGE_URI=postgresql+psycopg2://admin:admin@postgres:5432/stock-price-lstm
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.pipelines.model_sync"]

  # ---------------------------------------------------------
  # Apache Airflow: Orquestração de Workflows
  # ---------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    #container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --role Admin --username admin --email admin --firstname admin --lastname admin --password admin || true
      "

  airflow:
    image: apache/airflow:2.9.2-python3.11
    #container_name: airflow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/src
      - ENVIRONMENT=${ENVIRONMENT}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    #container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/src
      - ENVIRONMENT=${ENVIRONMENT}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    command: scheduler

  # ---------------------------------------------------------
  # LocalStack: Emulador da AWS para testes locais do Terraform
  # ---------------------------------------------------------
