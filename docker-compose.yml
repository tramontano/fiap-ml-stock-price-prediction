name: mlops

services:
  # ---------------------------------------------------------
  # MinIO: O nosso Data Lake local (Substitui o AWS S3)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000" # Porta da API (usada pelo boto3/Python)
      - "9001:9001" # Porta da Interface Gráfica (Web UI)
    env_file: ".env"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # ---------------------------------------------------------
  # MinIO Init: Container efêmero para criar os buckets
  # ---------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy # Só roda quando o MinIO estiver 100% pronto
    env_file: ".env"
    entrypoint: >
      /bin/sh -c "
      echo 'Configurando o alias do MinIO...';
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};

      echo 'Criando os buckets do Data Lake...';
      mc mb myminio/bronze --ignore-existing;
      mc mb myminio/silver --ignore-existing;
      mc mb myminio/gold --ignore-existing;
      mc mb myminio/models --ignore-existing;
      mc mb myminio/loki-data --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;

      echo 'Configuração do MinIO concluída!';
      "

  # ---------------------------------------------------------
  # PostgreSQL: Base de metadados
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file: ".env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------
  # 3. Observability Layer
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:12.3.9
    ports:
      - "3000:3000"
    env_file: ".env"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_INSTALL_PLUGINS=tobiasworkstech-parquets3-datasource
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisionamento automático de Dashboards e Data Sources
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.3
    user: 10001:10001
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - LOKI_INSTANCE_ID=mlops-loki-1
    command:
      ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always

  # ---------------------------------------------------------
  # FastAPI: Aplicação de Inferência e API
  # ---------------------------------------------------------
  model:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: ptsantos/private:fiap-ml-stock-price-prediction
    ports:
      - "8001:8001"
    env_file: ".env"
    volumes:
      # Mapeia o código fonte para hot-reload no ambiente local
      - ./src:/app/src:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "${API_HOST:-[IP_ADDRESS]}",
        "--port",
        "${API_PORT:-8001}",
        "--workers",
        "${WEB_CONCURRENCY:-1}",
      ]

  # ---------------------------------------------------------
  # Model Init: Sincronização do ponteiro do modelo Champion
  # ---------------------------------------------------------
  model-init:
    image: ptsantos/private:fiap-ml-stock-price-prediction
    env_file: ".env"
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - OPTUNA_STORAGE_URI=postgresql+psycopg2://admin:admin@postgres:5432/stock-price-lstm
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.pipelines.model_sync"]

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
