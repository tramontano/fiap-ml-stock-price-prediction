name: Fase4

services:
  # ---------------------------------------------------------
  # MinIO: O nosso Data Lake local (Substitui o AWS S3)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # Porta da API (usada pelo boto3/Python)
      - "9001:9001" # Porta da Interface Gráfica (Web UI)
    env_file: ".env/minio.env"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------
  # MinIO Init: Container efêmero para criar os buckets
  # ---------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy # Só roda quando o MinIO estiver 100% pronto
    env_file: ".env/minio.env"
    entrypoint: >
      /bin/sh -c "
      echo 'Configurando o alias do MinIO...';
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};

      echo 'Criando os buckets do Data Lake...';
      mc mb myminio/bronze --ignore-existing;
      mc mb myminio/silver --ignore-existing;
      mc mb myminio/gold --ignore-existing;
      mc mb myminio/models --ignore-existing;

      echo 'Configuração do MinIO concluída!';
      "

  # ---------------------------------------------------------
  # PostgreSQL: Base de metadados
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    env_file: ".env/postgres.env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------
  # 3. Observability Layer (Prometheus + Grafana)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mlops_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mlops_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisionamento automático de Dashboards e Data Sources
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------
  # FastAPI: Aplicação de Inferência e API
  # ---------------------------------------------------------
  web:
    build: 
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: web
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
    volumes:
      # Mapeia o código fonte para hot-reload no ambiente local
      - ./src:/app/src:ro 
    depends_on:
      minio:
        condition: service_healthy
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:
