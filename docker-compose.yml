name: mlops

services:
  # ---------------------------------------------------------
  # MinIO: O nosso Data Lake local (Substitui o AWS S3)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000" # Porta da API (usada pelo boto3/Python)
      - "9001:9001" # Porta da Interface Gráfica (Web UI)
    env_file: ".env"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # ---------------------------------------------------------
  # MinIO Init: Container efêmero para criar os buckets
  # ---------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy # Só roda quando o MinIO estiver 100% pronto
    env_file: ".env"
    entrypoint: >
      /bin/sh -c "
      echo 'Configurando o alias do MinIO...';
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};

      echo 'Criando os buckets do Data Lake...';
      mc mb myminio/bronze --ignore-existing;
      mc mb myminio/silver --ignore-existing;
      mc mb myminio/gold --ignore-existing;
      mc mb myminio/models --ignore-existing;
      mc mb myminio/loki-data --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;

      echo 'Configuração do MinIO concluída!';
      "

  # ---------------------------------------------------------
  # PostgreSQL: Base de metadados
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file: ".env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------
  # 3. Observability Layer (Prometheus + Grafana + Optuna)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:12.3.9
    ports:
      - "3000:3000"
    env_file: ".env"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_INSTALL_PLUGINS=tobiasworkstech-parquets3-datasource
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisionamento automático de Dashboards e Data Sources
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    ports:
      - "8888:8080"
    env_file: ".env"
    depends_on:
      - postgres
    command:
      - "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

  # ---------------------------------------------------------
  # FastAPI: Aplicação de Inferência e API
  # ---------------------------------------------------------
  model:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: ptsantos/private:fiap-ml-stock-price-prediction
    ports:
      - "8001:8001"
    env_file: ".env"
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - OPTUNA_STORAGE_URI=postgresql+psycopg2://admin:admin@postgres:5432/stock-price-lstm
      - AIRFLOW_API_URL=http://airflow:8080
      - AIRFLOW_USERNAME=admin
      - AIRFLOW_PASSWORD=admin
    volumes:
      # Mapeia o código fonte para hot-reload no ambiente local
      - ./src:/app/src:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "${API_HOST:-[IP_ADDRESS]}",
        "--port",
        "${API_PORT:-8001}",
        "--workers",
        "${WEB_CONCURRENCY:-1}",
      ]
    develop:
      watch:
        # Sincroniza o diretório de trabalho com o diretório `/src` no container
        - action: sync
          path: ./src
          target: /app/src
          # Exclui o ambiente virtual do projeto
          ignore:
            - .venv/
        # Rebuild the image on changes to the `pyproject.toml`
        - action: rebuild
          path: ./pyproject.toml

  # ---------------------------------------------------------
  # Model Init: Sincronização do ponteiro do modelo Champion
  # ---------------------------------------------------------
  model-init:
    image: ptsantos/private:fiap-ml-stock-price-prediction
    env_file: ".env"
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - OPTUNA_STORAGE_URI=postgresql+psycopg2://admin:admin@postgres:5432/stock-price-lstm
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.pipelines.model_sync"]

  # ---------------------------------------------------------
  # Apache Airflow: Orquestração de Workflows
  # ---------------------------------------------------------
  airflow-init:
    image: apache/airflow:3.3.0-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ".env"
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        airflow users create --role Admin --username "${AIRFLOW_USERNAME}" --email admin --firstname admin --lastname admin --password "${AIRFLOW_PASSWORD}" || true

  airflow:
    image: apache/airflow:3.3.0-python3.11
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: ".env"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/dags/src
    command: api-server
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-scheduler:
    image: apache/airflow:3.3.0-python3.11
    env_file: ".env"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-dag-processor:
    image: apache/airflow:3.3.0-python3.11
    env_file: ".env"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-statsd:
    image: prom/statsd-exporter:v0.26.0
    ports:
      - "8125:8125/udp"
      - "9102:9102"
    volumes:
      - ./monitoring/prometheus/statsd_mapping.yaml:/tmp/statsd_mapping.yaml
    command:
      - "--statsd.mapping-config=/tmp/statsd_mapping.yaml"

  loki:
    image: grafana/loki:3.7.3
    user: 10001:10001
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - LOKI_INSTANCE_ID=mlops-loki-1
    command:
      ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
